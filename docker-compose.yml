services:
  caddy:
    image: caddy:2-alpine
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      cloudspace:
        condition: service_healthy
    ports:
      # Caddy is the only service published to the host. It terminates HTTPS and
      # forwards traffic to Cloudspace over Docker's private service network.
      - "80:80"
      - "443:443"
    environment:
      CLOUDSPACE_HOSTNAME: ${CLOUDSPACE_HOSTNAME:?Set CLOUDSPACE_HOSTNAME to the public hostname, for example cloudspace.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  cloudspace:
    build:
      context: .
    image: cloudspace:local
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      # Internal only: Caddy reaches this as http://cloudspace:3000.
      - "3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      CLOUDSPACE_CONFIG_DIR: /data/config
      CLOUDSPACE_STATE_DIR: /data/state
      CLOUDSPACE_WORKTREE_ROOT: /data/worktrees
      CLOUDSPACE_ALLOWED_ROOTS: ${CLOUDSPACE_ALLOWED_ROOTS:-/workspace}
      CLOUDSPACE_PUBLIC_BASE_URL: ${CLOUDSPACE_PUBLIC_BASE_URL:-https://${CLOUDSPACE_HOSTNAME:?Set CLOUDSPACE_HOSTNAME to the public hostname, for example cloudspace.example.com}}
      CLOUDSPACE_OAUTH_OWNER_TOKEN: ${CLOUDSPACE_OAUTH_OWNER_TOKEN:?Set CLOUDSPACE_OAUTH_OWNER_TOKEN to a 16+ character secret}
      CLOUDSPACE_OAUTH_REFRESH_TOKEN_TTL_SECONDS: ${CLOUDSPACE_OAUTH_REFRESH_TOKEN_TTL_SECONDS:-604800}
      CLOUDSPACE_LOG_FORMAT: ${CLOUDSPACE_LOG_FORMAT:-json}
      CLOUDSPACE_LOG_LEVEL: ${CLOUDSPACE_LOG_LEVEL:-info}
      CLOUDSPACE_TRUST_PROXY: ${CLOUDSPACE_TRUST_PROXY:-1}
    volumes:
      - cloudspace-data:/data
      - ${CLOUDSPACE_WORKSPACE_PATH:?Set CLOUDSPACE_WORKSPACE_PATH to the local directory Cloudspace may expose}:/workspace
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  caddy-data:
  caddy-config:
  cloudspace-data:
